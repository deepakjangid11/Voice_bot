[project]
name = "voice-bot"
version = "0.1.0"
description = "AI Voice Bot"
readme = "README.md"
authors = [
    { name = "c language", email = "dj404729@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "elevenlabs>=2.74.1",
    "fastapi>=0.162.0",
    "groq>=1.7.0",
    "jinja2>=3.1.6",
    "pymysql>=1.2.3",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"